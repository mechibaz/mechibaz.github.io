<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    :root { --blue: #1f3dff; }
    body {
      transition: background-color 0.4s ease;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
    }
    main { font-size: 14px; line-height: 2.2; text-align: center; }
    h1 { font-size: inherit; font-weight: 400; }
    a {
      color: #fff;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      text-decoration-color: rgba(255, 255, 255, 0.4);
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }
    a:hover, a:focus-visible { color: var(--blue); text-decoration-color: var(--blue); outline: none; }
    body.blue { background: var(--blue); }
    body.blue a:hover, body.blue a:focus-visible { color: #000; text-decoration-color: #000; }
    body.blue .top { color: rgba(255, 255, 255, 0.85); }
    nav {
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.875rem;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    /* Smiley */
    .smiley {
      display: inline-block;
      width: 56px;
      height: 56px;
      margin-bottom: 1.25rem;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .smiley svg { width: 100%; height: 100%; overflow: visible; }
    .smiley svg * {
      fill: none;
      stroke: #fff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .smiley .eye, .smiley .mouth {
      transform-box: fill-box;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .smiley .eye { transform-origin: center bottom; }
    .smiley .mouth { transform-origin: center top; }

    .smiley:hover { transform: translateY(-2px) rotate(-4deg); }
    .smiley.happy { transform: rotate(-10deg); }

    .top {
      position: fixed;
      top: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.7);
    }
    .top time { font-variant-numeric: tabular-nums; margin-left: 0.875rem; }

    main, .top { position: relative; z-index: 1; }
    .top { position: fixed; }
    .bouncer {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .bouncer svg { width: 100%; height: 100%; overflow: visible; }
    .bouncer svg * {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bouncer svg circle, body.blue .smiley svg circle { fill: var(--blue); }
    body.blue .bouncer { opacity: 1; }
    .bouncer.xl svg * { stroke-width: 1.3; }

    /* No text selection when clicking the face fast */
    .smiley { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

    /* Tired face parts: hidden unless .tired */
    .smiley.done { cursor: default; transform: none !important; }
    .smiley .t, .bouncer .t { display: none; }
    .smiley.tired .t { display: inline; }
    .smiley.tired .h { display: none; }
    .zzz {
      position: absolute;
      font-size: 11px;
      pointer-events: none;
      opacity: 0;
      animation: zzz 2.4s ease-out infinite;
    }
    .zzz:nth-child(2) { animation-delay: 0.8s; }
    .zzz:nth-child(3) { animation-delay: 1.6s; }
    @keyframes zzz {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translate(14px, -26px) scale(1.2); opacity: 0; }
    }
    .zzzs { position: absolute; left: 50%; top: 0; margin-left: 22px; display: none; }
    .smiley-wrap { position: relative; display: inline-block; }
    .smiley-wrap.tired .zzzs { display: block; }

    /* Click-count message over a blurred page */
    .message {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.15);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .message.show { opacity: 1; }

    /* ---- Modes ---- */
    .phys-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .phys-layer > div { position: absolute; top: 0; left: 0; will-change: transform; }
    .fall-letter {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 800;
      line-height: 0.82;
      padding-top: 0.06em;
      color: var(--blue);
      letter-spacing: 0;
    }
    .fall-shape svg { display: block; }
    body.cream { background: #efebe3; color: var(--blue); }
    body.cream a { color: var(--blue); text-decoration-color: rgba(31, 61, 255, 0.4); }
    body.cream a:hover { color: #000; text-decoration-color: #000; }
    body.cream .top { color: rgba(31, 61, 255, 0.75); }
    body.cream .smiley svg * { stroke: var(--blue); }
    body.cream .zzz { color: var(--blue); }
    body.paper { background: #efebe3; color: #000; }
    body.paper .fall-letter { color: #000; }
    body.paper a { color: #000; text-decoration-color: rgba(0, 0, 0, 0.35); }
    body.paper a:hover { color: var(--blue); text-decoration-color: var(--blue); }
    body.paper .top { color: rgba(0, 0, 0, 0.6); }
    body.paper .smiley svg * { stroke: #000; }
    body.paper .zzz { color: #000; }
    body.paperblue { background: #efebe3; color: var(--blue); }
    body.paperblue a { color: var(--blue); text-decoration-color: rgba(31, 61, 255, 0.4); }
    body.paperblue a:hover { color: #000; text-decoration-color: #000; }
    body.paperblue .top { color: rgba(31, 61, 255, 0.75); }
    body.paperblue .smiley svg * { stroke: var(--blue); }
    body.paperblue .zzz { color: var(--blue); }
    body.themed { background: var(--bg); color: var(--text); }
    body.themed a { color: var(--text); text-decoration-color: color-mix(in srgb, var(--text) 40%, transparent); }
    body.themed a:hover, body.themed a:focus-visible { color: var(--hover); text-decoration-color: var(--hover); }
    body.themed .top { color: color-mix(in srgb, var(--text) 75%, transparent); }
    body.themed .smiley svg * { stroke: var(--text); }
    body.themed .zzz { color: var(--text); }
    body.themed .fall-letter { color: var(--ink); }
    body.bluepaper { background: var(--blue); color: #efebe3; }
    body.bluepaper a { color: #efebe3; text-decoration-color: rgba(239, 235, 227, 0.45); }
    body.bluepaper a:hover { color: #000; text-decoration-color: #000; }
    body.bluepaper .top { color: rgba(239, 235, 227, 0.8); }
    body.bluepaper .smiley svg * { stroke: #efebe3; }
    .ascii-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ascii-flower {
      position: absolute;
      bottom: -0.2em;
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.15;
      color: var(--blue);
      white-space: pre;
      transform-origin: 50% 100%;
    }
    .ascii-flower.bloomed { animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    .three-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
    .glitch-layer { position: fixed; inset: 0; pointer-events: none; z-index: 4; mix-blend-mode: normal; }
    .glitch-sq { position: absolute; }
    body.glitching main { text-shadow: 3px 0 #8a3dff, -3px 0 #ffffff; }

  </style>
</head>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

  </script>
  <script>
    (function () {
      var clock = document.getElementById('clock');
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZoneName: 'short'
      });
      function tick() { clock.textContent = fmt.format(new Date()); }
      tick();
      setInterval(tick, 1000);
    })();

    (function () {
      var smiley = document.getElementById('smiley');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var locked = false;
      var clicks = 0;

      // DVD-style bouncing smileys (blue mode)
      var svgMarkup = smiley.querySelector('svg').outerHTML;
      var bouncers = [], raf = null, lastT = 0, START_COUNT = 8, SIZE = 40;

      function addBouncers(n, fromFace) {
        var r = smiley.getBoundingClientRect();
        for (var i = 0; i < n; i++) {
          var el = document.createElement('div');
          el.className = SIZE > 100 ? 'bouncer xl' : 'bouncer';
          el.style.width = el.style.height = SIZE + 'px';
          el.innerHTML = svgMarkup;
          document.body.appendChild(el);
          var speed = 70 + Math.random() * 90; // px per second
          var a = Math.random() * Math.PI * 2;
          bouncers.push({
            el: el,
            x: fromFace ? r.left + r.width / 2 - SIZE / 2 : Math.random() * (innerWidth - SIZE),
            y: fromFace ? r.top + r.height / 2 - SIZE / 2 : Math.random() * (innerHeight - SIZE),
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed
          });
        }
      }

      function clearBouncers() {
        bouncers.forEach(function (b) { b.el.remove(); });
        bouncers = [];
      }

      function startBouncers() {
        if (reduce) return;
        if (!bouncers.length) addBouncers(START_COUNT, false);
        lastT = performance.now();
        if (!raf) raf = requestAnimationFrame(step);
      }

      function stopBouncers() {
        // let them fade out, then stop moving
        setTimeout(function () {
          if (!document.body.classList.contains('blue') && raf) {
            cancelAnimationFrame(raf);
            raf = null;
          }
        }, 450);
      }

      function step(t) {
        var dt = Math.min((t - lastT) / 1000, 0.05);
        lastT = t;
        var maxX = innerWidth - SIZE, maxY = innerHeight - SIZE;
        for (var i = 0; i < bouncers.length; i++) {
          var b = bouncers[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); }
          if (b.x >= maxX) { b.x = maxX; b.vx = -Math.abs(b.vx); }
          if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); }
          if (b.y >= maxY) { b.y = maxY; b.vy = -Math.abs(b.vy); }
          b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
        }
        raf = requestAnimationFrame(step);
      }

      function setBlue(on) {
        document.body.classList.toggle('blue', on);
        if (on) startBouncers(); else stopBouncers();
      }

      function reset() {
        locked = false;
        clicks = 0;
        setBlue(false);
        setTimeout(function () {
          if (!document.body.classList.contains('blue')) clearBouncers();
        }, 450);
      }

      var wrap = document.getElementById('smileyWrap');
      var message = document.getElementById('message');
      var msgTimer = null;
      var MAX_FACES = 400;
      var done = false;

      function showMessage(text) {
        message.textContent = text;
        message.classList.add('show');
        clearTimeout(msgTimer);
        msgTimer = setTimeout(function () { message.classList.remove('show'); }, 2600);
      }

      function setTired(on) {
        smiley.classList.toggle('tired', on);
        wrap.classList.toggle('tired', on);
      }

      // ------------------------------------------------------------
      // Random mode per visit: smileys | letters | faces3d | shapes | glitch
      // (add ?mode=letters etc. to the URL to force one)
      // ------------------------------------------------------------
      // Families are picked evenly; falling ones (letters / shapes / mix) then get a random size + palette.
      // Force one with e.g. ?mode=mix&palette=ink&size=xl
      var params = new URLSearchParams(location.search);
      var PALETTES = {
        night: { bg: '#000000', ink: '#1f3dff', text: '#ffffff', hover: '#1f3dff' },
        paper: { bg: '#efebe3', ink: '#1f3dff', text: '#1f3dff', hover: '#000000' },
        ink:   { bg: '#efebe3', ink: '#000000', text: '#000000', hover: '#1f3dff' },
        pool:  { bg: '#1f3dff', ink: '#efebe3', text: '#efebe3', hover: '#000000' },
        smoke: { bg: '#000000', ink: '#efebe3', text: '#efebe3', hover: '#1f3dff' }
      };
      var PNAMES = Object.keys(PALETTES);
      var LEGACY = {
        lettersXL: ['letters', 'ink', true], lettersXLblue: ['letters', 'paper', true],
        shapesXL: ['shapes', 'pool', true]
      };
      var FAMILIES = ['smileys', 'smileysXL', 'faces3d', 'flowers', 'letters', 'shapes', 'mix', 'letters3d', 'shapes3d'];
      function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
      var forced = params.get('mode'), mode, palette = null, xl = false;
      if (LEGACY[forced]) {
        mode = LEGACY[forced][0]; palette = LEGACY[forced][1]; xl = LEGACY[forced][2];
      } else {
        mode = FAMILIES.indexOf(forced) >= 0 ? forced : pick(FAMILIES);
        if (/^(letters|shapes|mix)(3d)?$/.test(mode)) {
          palette = PALETTES[params.get('palette')] ? params.get('palette') : pick(PNAMES);
          xl = params.has('size') ? params.get('size') === 'xl' : Math.random() < 0.5;
        }
      }
      document.documentElement.setAttribute('data-mode', mode + (palette ? '-' + palette + (xl ? '-xl' : '') : ''));

      var themed = false;
      function applyTheme() {
        if (themed || !palette) return;
        themed = true;
        var P = PALETTES[palette], b = document.body.style;
        b.setProperty('--bg', P.bg); b.setProperty('--ink', P.ink);
        b.setProperty('--text', P.text); b.setProperty('--hover', P.hover);
        document.body.classList.add('themed');
        // grain specks take the background color
        var base = document.getElementById('grain');
        if (base && !document.getElementById('grainDyn')) {
          var f = base.cloneNode(true); f.id = 'grainDyn';
          var c = [1, 3, 5].map(function (i) { return (parseInt(P.bg.substr(i, 2), 16) / 255).toFixed(3); });
          f.querySelector('feColorMatrix').setAttribute('values',
            '0 0 0 0 ' + c[0] + '  0 0 0 0 ' + c[1] + '  0 0 0 0 ' + c[2] + '  0 0 0 9 -6.2');
          base.parentNode.appendChild(f);
        }
      }
      function capFor() {
        if (xl) return mode === 'letters' ? 10 : mode === 'shapes' ? 7 : 9;
        return mode === 'shapes' ? 40 : 48;
      }

      var BLUE = '#1f3dff';
      function loadScript(src) {
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = src; s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
      }

      // ---------- Physics (letters + shapes) ----------
      var MATTER_URL = 'https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js';
      var physics = null, physicsReady = null;
      function getPhysics() {
        if (physicsReady) return physicsReady;
        physicsReady = (window.Matter ? Promise.resolve() : loadScript(MATTER_URL)).then(function () {
          var M = window.Matter;
          var engine = M.Engine.create();
          engine.gravity.y = 1.1;
          var layer = document.createElement('div');
          layer.className = 'phys-layer';
          document.body.appendChild(layer);
          var T = 200, walls = [];
          function buildWalls() {
            walls.forEach(function (w) { M.Composite.remove(engine.world, w); });
            var W = innerWidth, H = innerHeight;
            walls = [
              M.Bodies.rectangle(W / 2, H + T / 2, W * 3, T, { isStatic: true }),
              M.Bodies.rectangle(-T / 2, H / 2 - 2000, T, H * 2 + 4000, { isStatic: true }),
              M.Bodies.rectangle(W + T / 2, H / 2 - 2000, T, H * 2 + 4000, { isStatic: true })
            ];
            M.Composite.add(engine.world, walls);
          }
          buildWalls();
          addEventListener('resize', buildWalls);
          var items = [], raf = null, last = 0;
          function step(t) {
            var dt = Math.min(t - last, 32); last = t;
            M.Engine.update(engine, dt);
            for (var i = 0; i < items.length; i++) {
              var it = items[i], b = it.body;
              it.el.style.transform = 'translate(' + (b.position.x - it.ox) + 'px,' + (b.position.y - it.oy) + 'px) rotate(' + b.angle + 'rad)';
            }
            raf = requestAnimationFrame(step);
          }
          physics = {
            M: M, engine: engine, layer: layer, items: items,
            add: function (body, el, ox, oy) {
              el.style.transformOrigin = ox + 'px ' + oy + 'px';
              layer.appendChild(el);
              M.Composite.add(engine.world, body);
              items.push({ body: body, el: el, ox: ox, oy: oy });
              if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
            },
            clear: function () {
              items.forEach(function (it) { M.Composite.remove(engine.world, it.body); it.el.remove(); });
              items.length = 0;
              if (raf) { cancelAnimationFrame(raf); raf = null; }
            }
          };
          return physics;
        });
        return physicsReady;
      }

      // ---------- 2. Falling MECHIBAZ letters ----------
      var LETTERS = 'MECHIBAZ'.split('');
      function dropLetters(xl, chars) {
        getPhysics().then(function (P) {

              if (kind === 'triangle') {
                body = M.Bodies.polygon(x, y, 3, s * 0.62, opts);
                shape = shapeFrom(body.vertices.map(function (v) { return [v.x - body.position.x, v.y - body.position.y]; }));
              } else if (kind === 'star') {
                var R = s * 0.6;
                body = M.Bodies.polygon(x, y, 5, R * 0.72, opts);
                shape = shapeFrom(starPts(R, R * 0.45, 6));
              } else if (kind === 'blob') {
                var r = s * 0.55, k = r;
                body = M.Bodies.circle(x, y, r, opts);
                shape = new THREE.Shape();
                var Y = function (v) { return -(v - r); }, X = function (v) { return v - r; };
                shape.moveTo(X(k * 0.15), Y(k * 0.9));
                shape.bezierCurveTo(X(k * 0.05), Y(k * 0.2), X(k * 0.9), Y(-k * 0.05), X(k * 1.5), Y(k * 0.2));
                shape.bezierCurveTo(X(k * 2.1), Y(k * 0.45), X(k * 2.05), Y(k * 1.25), X(k * 1.75), Y(k * 1.6));
                shape.bezierCurveTo(X(k * 1.4), Y(k * 2.05), X(k * 0.6), Y(k * 2.05), X(k * 0.3), Y(k * 1.6));
                shape.bezierCurveTo(X(k * 0.12), Y(k * 1.35), X(k * 0.18), Y(k * 1.1), X(k * 0.15), Y(k * 0.9));
              } else if (kind === 'tile') {
                var w = s * 1.05, rr = s * 0.08, hw = w / 2;
                body = M.Bodies.rectangle(x, y, w, w, Object.assign({ chamfer: { radius: rr } }, opts));
                shape = new THREE.Shape();
                shape.moveTo(-hw + rr, -hw); shape.lineTo(hw - rr, -hw); shape.quadraticCurveTo(hw, -hw, hw, -hw + rr);
                shape.lineTo(hw, hw - rr); shape.quadraticCurveTo(hw, hw, hw - rr, hw); shape.lineTo(-hw + rr, hw);
                shape.quadraticCurveTo(-hw, hw, -hw, hw - rr); shape.lineTo(-hw, -hw + rr); shape.quadraticCurveTo(-hw, -hw, -hw + rr, -hw);
                var hole = new THREE.Path();
                starPts(w * 0.36, w * 0.15, 5).forEach(function (p, i) { if (i) hole.lineTo(p[0], -(p[1] + w * 0.03)); else hole.moveTo(p[0], -(p[1] + w * 0.03)); });
                hole.closePath(); shape.holes.push(hole);
              } else {
                var r2 = s * 0.42;
                body = M.Bodies.circle(x, y, r2, opts);
                shape = new THREE.Shape(); shape.absarc(0, 0, r2, 0, Math.PI * 2, false);
              }
              M.Body.setAngle(body, Math.random() * Math.PI * 2);
              M.Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.06);
              addMesh(extrude(shape, depth), body);
            },
            count: function () { return items.length; },
            clear: function () {
              items.forEach(function (it) { scene.remove(it.group); });
              items.length = 0;
              renderer.render(scene, camera);
              if (raf) { cancelAnimationFrame(raf); raf = null; }
            }
          };
          return fall3d;
        }
        return fall3dReady;
      }

      // Preload what this visit's mode needs so the first click is instant
      if (/^(letters|shapes|mix)/.test(mode)) getPhysics().catch(function () {});
      if (mode === 'faces3d') getThree().catch(function () {});
      if (/3d$/.test(mode) && mode !== 'faces3d') getFall3d().catch(function () {});

      function runMode() {
        if (mode === 'smileys') {
          locked = true;
          setBlue(true);
          if (!reduce && bouncers.length < MAX_FACES) {
            addBouncers(Math.min(4 + Math.round(clicks * 1.6), MAX_FACES - bouncers.length), true);
          }
        } else if (mode === 'smileysXL') {
          SIZE = Math.round(Math.max(220, Math.min(innerWidth, innerHeight) * 0.62));
          START_COUNT = 2;
          locked = true;
          setBlue(true);
          if (!reduce && bouncers.length < 24 && clicks > 1) addBouncers(1, true);
        } else if (mode === 'letters' || mode === 'shapes' || mode === 'mix') {
          applyTheme();
          if (mode === 'letters') dropLetters(xl);
          else if (mode === 'shapes') { dropShape(xl); if (clicks === 1 && !xl) { dropShape(xl); dropShape(xl); } }
          else dropMix(xl);
        } else if (mode === 'letters3d' || mode === 'shapes3d') {
          applyTheme();
          getFall3d().then(function (F) {
            var cap = mode === 'letters3d' ? (xl ? 10 : 32) : (xl ? 7 : 26);
            if (F.count() >= cap) return;
            if (mode === 'letters3d') {
              var chars = xl ? [LETTERS[(clicks - 1) * 2 % 8], LETTERS[((clicks - 1) * 2 + 1) % 8]] : LETTERS;
              chars.forEach(function (ch, i) { setTimeout(function () { F.letter(ch, xl); }, i * 80); });
            } else {
              F.shape(xl); if (clicks === 1 && !xl) { F.shape(false); F.shape(false); }
            }
          });
        } else if (mode === 'faces3d') {
          getThree().then(function (T) { T.add(clicks === 1 ? 6 : 3); });
        } else if (mode === 'glitch') {
          glitch();
        } else if (mode === 'flowers') {
          document.body.classList.add('paperblue');
          growExisting();
          growFlower(); if (clicks === 1) { growFlower(); growFlower(); }
        }
      }

      function clearModes() {
        if (physics) physics.clear();
        if (three) three.clear();
        if (fall3d) fall3d.clear();
        clearFlowers();
        stopGlitch();
        glitchUntil = 0;
        document.body.classList.remove('cream', 'paper', 'bluepaper', 'paperblue', 'themed');
        themed = false;
      }

      // Stop fast clicks from selecting the text underneath
      smiley.addEventListener('mousedown', function (e) { e.preventDefault(); });

      // 150 clicks: a message. 300: "nice". 600: back to black, tired face, no more clicking.
      smiley.addEventListener('click', function () {
        if (done) return;
        clicks++;

        if (clicks >= 600) {
          done = true;
          reset();
          clearModes();
          setTired(true);
          smiley.classList.add('done');
          clearTimeout(msgTimer);
          message.classList.remove('show');
          return;
        }

        runMode();

        if (clicks === 150) showMessage('why are you clicking so much? :)');
        if (clicks === 300) showMessage('nice');

        smiley.classList.add('happy');
        setTimeout(function () { smiley.classList.remove('happy'); }, 300);
      });
    })();
  </script>
</body>
